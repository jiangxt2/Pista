name: osv-scan

on:
  workflow_call:
    inputs:
      candidate_artifact:
        description: Candidate artifact from this run; empty for a source dependency scan
        required: false
        type: string
        default: ""
      release_version:
        required: false
        type: string
        default: ""
      source_commit:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate release-scoped SBOMs
        if: inputs.candidate_artifact == ''
        run: scripts/generate_sbom.sh

      - name: Download the candidate under review
        if: inputs.candidate_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_artifact }}
          path: target/release

      - name: Verify and select the candidate SBOM
        if: inputs.candidate_artifact != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 -B scripts/prepare_release.py verify --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT"
          mkdir -p target/sbom
          cp target/release/pista-jvm.cdx.json target/sbom/pista-jvm.cdx.json

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --output=results.json
            --format=json
            --config=./osv-scanner.toml
            --lockfile=target/sbom/pista-jvm.cdx.json
        continue-on-error: true

      - name: Enforce vulnerability result
        uses: google/osv-scanner-action/osv-reporter-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=true

      - name: Upload OSV results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scan-results
          path: |
            results.json
            results.sarif
            target/sbom/*.cdx.json
          if-no-files-found: warn
          retention-days: 5
