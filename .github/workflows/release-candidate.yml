name: release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved stable major.minor.patch version
        required: true
        type: string
      expected_commit:
        description: Approved full source commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: release-candidate
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_COMMIT: ${{ inputs.expected_commit }}
    outputs:
      artifact_name: pista-release-candidate-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate approved source and version
        run: python3 -B scripts/prepare_release.py check --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: "17.0.18.9.1"
          cache: maven
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python3 -B scripts/check_public_content.py
          python3 -B scripts/check_language.py
          python3 -B scripts/check_markdown.py
          python3 -B scripts/check_public_license.py
      - run: |
          python3 -m pip install --disable-pip-version-check --no-input pytest==9.1.1 ruff==0.14.14
          ruff format --check scripts
          ruff check scripts
          python3 -m pytest scripts/tests -q
      - run: ./mvnw -B test
      - run: |
          ./mvnw -B package -DskipTests -Dpista.source.revision="$SOURCE_COMMIT"
          python3 -B scripts/check_assembly.py
          scripts/generate_sbom.sh
      - run: scripts/prepare_hosted_runner.sh
      - run: scripts/run_domain_it.sh
      - run: scripts/run_domain_it.sh submitter
      - name: Package the validated candidate
        run: python3 -B scripts/prepare_release.py package --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pista-release-candidate-${{ github.sha }}
          path: target/release/*
          if-no-files-found: error
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pista-candidate-validation-${{ github.sha }}
          path: |
            **/target/surefire-reports/**
            **/target/pista-it-*/**
            /tmp/pista-*.log
          if-no-files-found: ignore

  vulnerability-scan:
    needs: build-candidate
    uses: ./.github/workflows/osv-scan.yml
    with:
      candidate_artifact: ${{ needs.build-candidate.outputs.artifact_name }}
      release_version: ${{ inputs.version }}
      source_commit: ${{ inputs.expected_commit }}
    permissions:
      contents: read
